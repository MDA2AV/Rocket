name: Build, Test, and Publish

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0'

      - name: Restore
        run: dotnet restore zerg.sln

      - name: Build
        run: dotnet build zerg.sln --configuration Release --no-restore

      - name: Pack zerg.core
        run: dotnet pack core/core.csproj --configuration Release --no-build --output ./artifacts

      - name: Pack zerg
        run: dotnet pack zerg/zerg.csproj --configuration Release --no-build --output ./artifacts

      - name: Pack terraform
        run: dotnet pack terraform/terraform.csproj --configuration Release --no-build --output ./artifacts

      - name: Publish to NuGet
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: dotnet nuget push ./artifacts/*.nupkg --source https://api.nuget.org/v3/index.json --api-key $NUGET_API_KEY --skip-duplicate

      - name: Publish to GitHub Packages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: dotnet nuget push ./artifacts/*.nupkg --source https://nuget.pkg.github.com/MDA2AV/index.json --api-key $GITHUB_TOKEN --skip-duplicate
